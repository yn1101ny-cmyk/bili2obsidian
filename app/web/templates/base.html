<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyNoteApp{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% set path = request.url.path %}
  <header class="topbar">
    <a class="brand" href="/"><span class="dot"></span>MyNoteApp</a>
    <nav>
      <a href="/" class="{{ 'active' if path == '/' else '' }}">首页</a>
      <a href="/checks" class="{{ 'active' if path == '/checks' else '' }}">环境自检</a>
    </nav>
  </header>

  {% block layout %}
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}

  <footer class="foot">
    本地优先 · 数据只存在本机 <code>{{ settings.data_dir }}</code> · 服务仅监听 <code>{{ settings.host }}</code>
  </footer>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
