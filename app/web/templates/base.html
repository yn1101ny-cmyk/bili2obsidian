<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyNoteApp{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">📒 MyNoteApp</a>
    <nav>
      <a href="/">首页</a>
      <a href="/checks">环境自检</a>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    本地优先 · 数据只存在本机 <code>{{ settings.data_dir }}</code> · 服务仅监听 <code>{{ settings.host }}</code>
  </footer>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
