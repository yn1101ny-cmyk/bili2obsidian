{% extends "base.html" %}
{% block title %}MyNoteApp · 把 B站视频变成笔记{% endblock %}

{% block content %}
<section class="hero">
  <h1>贴一个 B站链接</h1>
  <p class="sub">
    从标题和简介判断你真正想拿到的重点，抓出视频里的提示词、命令和步骤，
    整理成能直接用的笔记。全部在本机完成。
  </p>

  <form id="note-form" autocomplete="off">
    <input
      id="url-input"
      type="text"
      name="url"
      placeholder="BV 号 / av 号 / 完整链接 / b23.tv 短链，也可直接粘贴分享文案"
      required
    >
    <button id="submit-btn" type="submit">生成笔记</button>
  </form>
  <p class="hint" id="form-hint"></p>
</section>

<section id="job-panel" class="card job-panel" hidden>
  <div class="job-head">
    <span class="stage" id="job-stage">排队中</span>
    <span class="spacer"></span>
    <span class="elapsed" id="job-elapsed"></span>
    <button class="ghost" id="cancel-btn" type="button">取消</button>
  </div>

  <div class="bar"><div class="bar-fill" id="job-bar"></div></div>

  <p class="job-msg" id="job-msg"></p>
  <details class="job-log-wrap">
    <summary>详细日志</summary>
    <pre class="job-log" id="job-log"></pre>
  </details>
  <p class="job-done" id="job-done" hidden></p>
</section>

<section class="notes">
  <div class="section-head">
    <h2>最近的笔记</h2>
    <span class="muted" id="notes-count"></span>
  </div>
  <div id="notes-list" class="notes-list">
    <p class="muted">加载中…</p>
  </div>
</section>
{% endblock %}
