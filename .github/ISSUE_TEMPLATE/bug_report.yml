name: Bug 报告
description: 跑不通、报错、结果不对
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先跑一次自检，把结果贴上来能省很多来回：

        ```powershell
        .\.venv\Scripts\python.exe -m scripts.doctor --json
        ```

        ⚠️ 贴日志前请确认里面**没有 `SESSDATA`**（它等价于你的登录凭证）。

  - type: textarea
    id: what-happened
    attributes:
      label: 出了什么问题
      description: 期望发生什么，实际发生了什么。有报错就贴完整报错文本（不要只贴最后一行）。
      placeholder: |
        期望：贴链接后产出一篇笔记
        实际：卡在「下载音频」，日志最后是 ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量具体到命令和链接类型。
      placeholder: |
        1. .\.venv\Scripts\python.exe -m scripts.mynote "https://www.bilibili.com/video/BV..."
        2. 等到「转写」这一步
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: 自检输出（doctor --json）
      render: json
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: 环境
      description: Python 版本 / Windows 版本 / 显卡型号（或纯 CPU）/ 是否装了 requirements-vision.txt
      placeholder: Python 3.13.5 / Windows 11 26100 / RTX 5060 8GB / 装了 vision
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自查
      options:
        - label: 我用的是项目自己的 `.venv`，不是系统 Python
          required: true
        - label: 我贴出的日志里没有 SESSDATA / API Key 等密钥
          required: true
        - label: 我已经搜过已有 issue，没有重复
          required: false
