[project]
name = "mynoteapp"
version = "0.1.0"
description = "本地优先的「B站视频 → 可理解笔记」工具"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 async def 测试无需逐个加 @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
